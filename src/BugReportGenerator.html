<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Google Sans', Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
      color: #202124;
    }

    select, input {
      width: 100%;
      padding: 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 8px;
    }

    button:hover {
      background-color: #1557b0;
    }

    button:disabled {
      background-color: #dadce0;
      cursor: not-allowed;
    }

    .button-secondary {
      background-color: white;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }

    .button-secondary:hover {
      background-color: #f8f9fa;
    }

    #reportOutput {
      display: none;
      margin-top: 20px;
    }

    #reportText {
      width: 100%;
      height: 300px;
      padding: 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
      box-sizing: border-box;
    }

    .info {
      background-color: #e8f0fe;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #1967d2;
    }

    .radio-group {
      margin-bottom: 12px;
    }

    .radio-group label {
      display: inline-block;
      font-weight: normal;
      margin-right: 16px;
      cursor: pointer;
    }

    .radio-group input[type="radio"] {
      width: auto;
      margin-right: 4px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #5f6368;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1a73e8;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="info">
    This tool generates a comprehensive bug report including client details, logs, diagnostic data, and recent emails.
  </div>

  <div id="formSection">
    <div class="section">
      <label>Time Range</label>
      <div class="radio-group">
        <label><input type="radio" name="timeRange" value="1" checked> Last 1 hour</label>
        <label><input type="radio" name="timeRange" value="6"> Last 6 hours</label>
        <label><input type="radio" name="timeRange" value="24"> Last 24 hours</label>
        <label><input type="radio" name="timeRange" value="custom"> Custom</label>
      </div>
    </div>

    <div class="section" id="customTimeSection" style="display:none;">
      <label>Start Time</label>
      <input type="datetime-local" id="startTime">

      <label style="margin-top: 8px;">End Time</label>
      <input type="datetime-local" id="endTime">
    </div>

    <div class="section">
      <label>Client (optional - leave blank for all clients)</label>
      <select id="clientSelect">
        <option value="">All Clients</option>
      </select>
    </div>

    <div class="section">
      <button onclick="generateReport()">Generate Report</button>
      <button class="button-secondary" onclick="google.script.host.close()">Cancel</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Generating bug report...</div>
  </div>

  <div id="reportOutput">
    <div class="section">
      <label>Bug Report (copy and paste this)</label>
      <textarea id="reportText" readonly></textarea>
    </div>

    <div class="section">
      <button onclick="copyReport()">Copy to Clipboard</button>
      <button class="button-secondary" onclick="downloadReport()">Download as .txt</button>
      <button class="button-secondary" onclick="resetForm()">Generate Another</button>
    </div>
  </div>

  <script>
    // Load clients on page load
    google.script.run
      .withSuccessHandler(populateClients)
      .getClientsForBugReport();

    // Set default end time to now
    const now = new Date();
    document.getElementById('endTime').value = formatDateTimeLocal(now);

    // Time range radio change handler
    document.querySelectorAll('input[name="timeRange"]').forEach(radio => {
      radio.addEventListener('change', function() {
        if (this.value === 'custom') {
          document.getElementById('customTimeSection').style.display = 'block';
        } else {
          document.getElementById('customTimeSection').style.display = 'none';
        }
      });
    });

    function populateClients(clients) {
      const select = document.getElementById('clientSelect');
      clients.forEach(client => {
        const option = document.createElement('option');
        option.value = client;
        option.textContent = client;
        select.appendChild(option);
      });
    }

    function generateReport() {
      // Get time range
      const timeRangeValue = document.querySelector('input[name="timeRange"]:checked').value;
      let startTime, endTime;

      if (timeRangeValue === 'custom') {
        const startInput = document.getElementById('startTime').value;
        const endInput = document.getElementById('endTime').value;

        if (!startInput || !endInput) {
          alert('Please select both start and end times for custom range');
          return;
        }

        startTime = new Date(startInput);
        endTime = new Date(endInput);
      } else {
        endTime = new Date();
        startTime = new Date(endTime.getTime() - (parseInt(timeRangeValue) * 60 * 60 * 1000));
      }

      // Get client
      const clientName = document.getElementById('clientSelect').value;

      // Build criteria
      const criteria = {
        startTime: startTime.toISOString(),
        endTime: endTime.toISOString(),
        clientName: clientName || null
      };

      // Show loading
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      // Generate report
      google.script.run
        .withSuccessHandler(displayReport)
        .withFailureHandler(handleError)
        .generateBugReport(criteria);
    }

    function displayReport(report) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('reportOutput').style.display = 'block';
      document.getElementById('reportText').value = report;
    }

    function handleError(error) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('formSection').style.display = 'block';
      alert('Error generating report: ' + error.message);
    }

    function copyReport() {
      const textarea = document.getElementById('reportText');
      textarea.select();
      document.execCommand('copy');
      alert('Report copied to clipboard!');
    }

    function downloadReport() {
      const report = document.getElementById('reportText').value;
      const blob = new Blob([report], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bug-report-' + new Date().toISOString().split('T')[0] + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function resetForm() {
      document.getElementById('reportOutput').style.display = 'none';
      document.getElementById('formSection').style.display = 'block';
      document.getElementById('reportText').value = '';
    }

    function formatDateTimeLocal(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }
  </script>
</body>
</html>
